<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="calc_v3.js" defer></script>
</head>
<body>
    <label for="n1">Primo numero: <input type="number" id="n1"></label>
    <br><br>
    
    <label>
        Operazione:
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="**">**</option>
            <option value="%">Resto</option>
            <option value="MAX">MAX</option>
            <option value="MIN">MIN</option>
            <option value="AVG">Media</option>
            <option value="LNTR">Lontrinator</option>

        </select>
    </label>
    <br><br>

    <div class="contenitore"></div>

    <label for="n2">Secondo numero: <input type="number" id="n2"></label>
    <button type="submit" id="calcolaBtn">CALCOLA</button>
    <br>

    <h3>Risultato:</h3>
    <p id="result"></p>
    <p id="messaggio"></p>
    
</body>
</html>
